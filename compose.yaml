services:
  cognition:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - cognition-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  cognition-data:
