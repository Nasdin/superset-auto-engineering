include:
  - path: compose.postgres.yaml
    project_directory: .
  - path: infra/analytics.compose.yaml
    project_directory: .

x-runtime: &runtime
  build: .
  environment: &runtime-environment
    DATABASE_URL: postgresql+psycopg://cognition_app:${POSTGRES_APP_PASSWORD:?Run scripts/configure_local_postgres.py}@postgres:5432/cognition
    ARTIFACT_DIR: /app/data/artifacts
    EVIDENCE_PUBLIC_URL: ${EVIDENCE_PUBLIC_URL:-}
    AUTOMATION_ENABLED: ${AUTOMATION_ENABLED:-false}
    AUTOMATIC_INTAKE: ${AUTOMATIC_INTAKE:-false}
    AUTOMATIC_INTAKE_SINCE: ${AUTOMATIC_INTAKE_SINCE:-}
    GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-Nasdin/superset}
    TARGET_BRANCH: ${TARGET_BRANCH:-cognition-release-6.1}
    DEVIN_ORG_ID: ${DEVIN_ORG_ID:-org-f456da0f2e0940808b5c8b3a20312d8c}
    GITHUB_ALLOWED_ACTOR: ${GITHUB_ALLOWED_ACTOR:-Nasdin}
    TRIGGER_LABEL: ${TRIGGER_LABEL:-cognition:repair}
    DEVIN_MAX_ACU: ${DEVIN_MAX_ACU:-10}
    DEVIN_MAX_SESSIONS: ${DEVIN_MAX_SESSIONS:-6}
    SESSION_TIMEOUT_SECONDS: ${SESSION_TIMEOUT_SECONDS:-7200}
    POLL_SECONDS: ${POLL_SECONDS:-30}
    SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-86400}
    BATCH_WINDOW_SECONDS: ${BATCH_WINDOW_SECONDS:-60}
    LEARNING_ENABLED: ${LEARNING_ENABLED:-true}
    DEPENDABOT_ENABLED: ${DEPENDABOT_ENABLED:-true}
    VALIDATION_CAPTURE_FAILURE_EVIDENCE: ${VALIDATION_CAPTURE_FAILURE_EVIDENCE:-false}
    AUTONOMOUS_REMEDIATION: ${AUTONOMOUS_REMEDIATION:-true}
    MAX_REMEDIATION_ATTEMPTS: ${MAX_REMEDIATION_ATTEMPTS:-2}
    DEVIN_API_KEY: ${DEVIN_API_KEY:-}
    CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
    CLOUDFLARE_AUDIT_SECRET_ID: ${CLOUDFLARE_AUDIT_SECRET_ID:-}
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
    SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
    SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID:-}
    SUPERSET_INTERNAL_URL: ${SUPERSET_INTERNAL_URL:-http://analytics-superset:8088/bi}
    SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL:-http://127.0.0.1:8189/bi}
    ANALYTICS_SUPERSET_SERVICE_PASSWORD: ${ANALYTICS_SUPERSET_SERVICE_PASSWORD:-}
    ENABLE_DEMO: ${ENABLE_DEMO:-false}
    DB_POOL_SIZE: ${DB_POOL_SIZE:-2}
    DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-1}
    DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
    DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
    DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
    DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - cognition-data:/app/data
services:
  cognition:
    <<: *runtime
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      REVIEWER_PASSWORD_HASH: ${REVIEWER_PASSWORD_HASH:-}
    ports:
      - "127.0.0.1:${COGNITION_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    <<: *runtime
    command: ["python", "-m", "app.automation.worker"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.automation.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
  analytics:
    <<: *runtime
    environment:
      DATABASE_URL: postgresql+psycopg://cognition_app:${POSTGRES_APP_PASSWORD:?Run scripts/configure_local_postgres.py}@postgres:5432/cognition
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-Nasdin/superset}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-1}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
    command: ["python", "-m", "app.analytics.sync"]
    restart: unless-stopped
volumes:
  cognition-data:
