services:
  postgres:
    image: ${COMPOSE_PROJECT_NAME:-cognition}-postgres:17
    build:
      context: .
      dockerfile: infra/Postgres.Dockerfile
    environment:
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?required}
      POSTGRES_SUPERSET_PASSWORD: ${POSTGRES_SUPERSET_PASSWORD:?required}
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:?required}
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run scripts/configure_local_postgres.py first}
    volumes:
      - cognition-postgres:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 20
volumes:
  cognition-postgres:
