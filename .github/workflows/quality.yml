name: Code quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cognition_app
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: cognition_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cognition_app -d cognition_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cognition_app:ci-test-password@127.0.0.1:5432/cognition_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend tools
        run: pip install -r backend/requirements-dev.txt
      - name: Python lint and formatting
        run: |
          ruff check backend
          ruff format --check backend
      - name: Create read-only reporting role for isolated Postgres tests
        env:
          PGPASSWORD: ci-test-password
        run: psql -h 127.0.0.1 -U cognition_app -d cognition_test -c "CREATE ROLE cognition_reader NOLOGIN"
      - name: Backend tests with branch coverage
        run: pytest --cov --cov-fail-under=80 -q
      - name: Install frontend tools
        working-directory: frontend
        run: npm ci
      - name: Type check, formatting and production build
        working-directory: frontend
        run: |
          npm run typecheck
          npm run format:check
          npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser and frontend tests with isolated databases
        working-directory: frontend
        env:
          TEST_PYTHON: python
        run: |
          npm run test:e2e
          python ../scripts/test_login_e2e.py
      - name: Build production container
        run: docker build -t cognition-quality .

      - name: Verify production container startup
        run: |
          docker run -d --name cognition-quality-smoke -p 127.0.0.1:18000:8000 \
            -e AUTOMATION_ENABLED=false -e DATABASE_URL= \
            -e AUTOMATION_DATABASE=/app/data/automation.db cognition-quality
          trap 'docker logs --tail=40 cognition-quality-smoke; docker rm -f cognition-quality-smoke' EXIT
          curl --retry 30 --retry-all-errors --retry-delay 2 --max-time 10 --fail http://127.0.0.1:18000/api/health
          python - <<'PYTHON'
          import json, re, urllib.request
          origin = "http://127.0.0.1:18000"
          with urllib.request.urlopen(origin + "/api/health") as response:
              assert json.load(response)["automation_enabled"] is False
          with urllib.request.urlopen(origin + "/") as response:
              html = response.read().decode()
          script = re.search(r'src="(/assets/[^" ]+\.js)"', html)
          assert script, "Compiled frontend entry is missing from the image"
          with urllib.request.urlopen(origin + script.group(1)) as response:
              assert response.status == 200 and len(response.read()) > 1000
          print("Fresh production image serves API and compiled frontend")
          PYTHON
