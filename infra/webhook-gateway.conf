# Expose ONLY this gateway if a public GitHub webhook tunnel is added.
# Never tunnel the dashboard or worker directly.
server {
  listen 8080;
  client_max_body_size 1m;
  location = /api/live/webhooks/github {
    limit_except POST { deny all; }
    proxy_pass http://cognition:8000;
    proxy_set_header Host $host;
  }
  location / { return 404; }
}
